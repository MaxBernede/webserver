<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>POST and DELETE</title>
</head>
<body>
	<h1>Here you can a test the POST and DELETE methods</h1>
	<p>Try out POST:</p>
	<form action="/page2.html" method="post" enctype="multipart/form-data">
		<input type="file" id="file" name="i" placeholder="Enter your name">
		<button type="submit">Create File</button>
	</form>
	<br>
	<!-- DELETE method -->
	<p>Try out DELETE:</p>
	<form id="deleteForm" onsubmit="sendDeleteRequest(event)">
		<input type="text" id="filename" name="filename" placeholder="Enter filename to delete" required>
		<button type="submit">Delete (DELETE)</button>
	</form>

	<br>
	<a href="index.html">Back to Home</a>
</body>
<script>
	function sendDeleteRequest(event) {
	  event.preventDefault(); // Prevent the form from submitting the traditional way
	  const filename = document.getElementById('filename').value;
  
	  fetch('/delete', {
		method: 'DELETE',
		headers: {
		  'Content-Type': 'application/json',
		},
		body: JSON.stringify({ filename: filename }),
	  })
	//   .then(response => response.json())
	//   .then(data => console.log('Success:', data))
	//   .catch((error) => console.error('Error:', error));
	.then(response => {
	if (!response.ok) {
	  throw new Error('Network response was not ok');
	}
	// Since we're expecting an HTML response, use response.text()
	return response.text();
  	})
  	.then(html => {
	// Assuming you want to display the HTML response in the page
	document.getElementById('response-container').innerHTML = html;
	console.log('Success:', html);
 	})
  	.catch((error) => {
	console.error('Error:', error);
	document.getElementById('response-container').innerHTML = '<p>Error occurred while processing the request.</p>';
  	});
	}
</script>
</html>
